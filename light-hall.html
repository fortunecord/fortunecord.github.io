<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Light Hall – An immersive, magical and dynamic collage gallery of FortuneCord's 3000 original coin line art pieces.">
    <title>Light Hall – FortuneCord</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: sans-serif;
            background: radial-gradient(circle at 50% 50%, #1a103c 0%, #0a1128 70%);
            overflow: hidden;
            height: 100vh;
            position: relative;
        }
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            background-image: radial-gradient(...);
            /* 你的首页星点直接抄过来 */
        }
        #layout {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 20px;
            padding: 30px;
            z-index: 1;
        }
        .item {
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .item img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            mix-blend-mode: multiply;  
            filter: brightness(2) drop-shadow(0 0 8px rgba(180, 220, 255, 0.8)) drop-shadow(0 0 20px rgba(140, 80, 255, 0.6));
            transition: transform 0.5s ease, filter 0.5s ease;
        }
        .controls {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            display: flex;
            gap: 20px;
        }
        .controls button {
            background: #211843;
            color: #4AF6F4;
            border: 1px solid #FFD700;
            border-radius: 30px;
            padding: 10px 25px;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(74, 246, 244, 0.4);
            transition: 0.3s;
        }
        .controls button:hover {
            background: #4AF6F4;
            color: #0a1128;
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.8);
        }
        #title {
            position: fixed;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: #b8a310;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(184, 163, 16, 0.6);
            letter-spacing: 5px;
            z-index: 100;
        }
    </style>
</head>
<body>
    <div id="title">✦ 光影馆 ✦</div>
    <div id="layout"></div>
    <div class="controls">
        <button onclick="prevPage()">◀ 上一页</button>
        <button onclick="nextPage()">下一页 ▶</button>
    </div>

    <script>
        const layout = document.getElementById('layout');
        let allImages = [];

        async function getAllImages() {
            try {
                let response = await fetch('https://api.github.com/repos/fortunecord/fortunecord-artworks/git/trees/main?recursive=1');
                if (!response.ok) response = await fetch('https://api.github.com/repos/fortunecord/fortunecord-artworks/git/trees/master?recursive=1');
                let data = await response.json();
                let paths = data.tree.map(item => item.path);
                allImages = paths.filter(path => /\.(jpg|jpeg|png)$/i.test(path));
            } catch (e) {
                allImages = [];
            }
        }

        function render() {
            layout.innerHTML = '';
            if (allImages.length === 0) return;
            let count = 20;
            for (let i = 0; i < count; i++) {
                let item = document.createElement('div');
                item.className = 'item';
                let colSpan = Math.floor(Math.random() * 3) + 1;
                let rowSpan = Math.floor(Math.random() * 2) + 1;
                item.style.gridColumn = 'span ' + colSpan;
                item.style.gridRow = 'span ' + rowSpan;

                let img = document.createElement('img');
                let randomPath = allImages[Math.floor(Math.random() * allImages.length)];
                img.src = 'https://fortunecord.github.io/fortunecord-artworks/' + randomPath;
                img.style.filter = `invert(1) brightness(2) drop-shadow(0 0 8px rgba(180, 220, 255, 0.8)) drop-shadow(0 0 20px rgba(140, 80, 255, 0.6))`;
                item.appendChild(img);
                layout.appendChild(item);
            }
        }

        function prevPage() { render(); }
        function nextPage() { render(); }

        getAllImages().then(render);
    </script>
</body>
</html>
