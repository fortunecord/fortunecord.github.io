<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>光影馆 – FortuneCord</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: sans-serif;
            background: radial-gradient(circle at 50% 50%, #1a103c 0%, #0a1128 70%);
            overflow: hidden;
            height: 100vh;
            position: relative;
        }
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            background-image:
                radial-gradient(2.5px 2.5px at 13% 24%, #fff, rgba(0,0,0,0)),
                radial-gradient(3px 3px at 81% 17%, #ffe, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 39% 83%, #ffd, rgba(0,0,0,0)),
                radial-gradient(2.5px 2.5px at 66% 61%, #fff, rgba(0,0,0,0)),
                radial-gradient(1.8px 1.8px at 91% 43%, #d4e4ff, rgba(0,0,0,0)),
                radial-gradient(2.8px 2.8px at 7% 68%, #fff, rgba(0,0,0,0)),
                radial-gradient(2.2px 2.2px at 54% 9%, #ffe, rgba(0,0,0,0)),
                radial-gradient(1.6px 1.6px at 28% 47%, #ffd, rgba(0,0,0,0)),
                radial-gradient(2.2px 2.2px at 74% 92%, #fff, rgba(0,0,0,0)),
                radial-gradient(1.2px 1.2px at 18% 11%, #fff, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 48% 38%, #ffd, rgba(0,0,0,0)),
                radial-gradient(1.3px 1.3px at 85% 67%, #fff, rgba(0,0,0,0)),
                radial-gradient(1.1px 1.1px at 62% 28%, #ffe, rgba(0,0,0,0)),
                radial-gradient(0.9px 0.9px at 33% 58%, #d4e4ff, rgba(0,0,0,0)),
                radial-gradient(1.2px 1.2px at 59% 80%, #fff, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 96% 15%, #ffd, rgba(0,0,0,0)),
                radial-gradient(1.4px 1.4px at 24% 73%, #fff, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 71% 49%, #ffe, rgba(0,0,0,0)),
                radial-gradient(1.2px 1.2px at 43% 22%, #fff, rgba(0,0,0,0)),
                radial-gradient(0.8px 0.8px at 6% 49%, #ffd, rgba(0,0,0,0)),
                radial-gradient(0.6px 0.6px at 15% 35%, #fff, rgba(0,0,0,0)),
                radial-gradient(0.8px 0.8px at 47% 55%, #ffd, rgba(0,0,0,0)),
                radial-gradient(0.5px 0.5px at 79% 77%, #fff, rgba(0,0,0,0)),
                radial-gradient(0.7px 0.7px at 52% 16%, #ffe, rgba(0,0,0,0)),
                radial-gradient(0.5px 0.5px at 29% 88%, #fff, rgba(0,0,0,0)),
                radial-gradient(0.8px 0.8px at 88% 34%, #d4e4ff, rgba(0,0,0,0)),
                radial-gradient(0.6px 0.6px at 37% 64%, #fff, rgba(0,0,0,0)),
                radial-gradient(0.7px 0.7px at 63% 91%, #ffd, rgba(0,0,0,0)),
                radial-gradient(0.5px 0.5px at 11% 87%, #ffe, rgba(0,0,0,0)),
                radial-gradient(0.8px 0.8px at 91% 8%, #fff, rgba(0,0,0,0)),
                radial-gradient(0.5px 0.5px at 41% 42%, #ffd, rgba(0,0,0,0)),
                radial-gradient(0.7px 0.7px at 68% 7%, #fff, rgba(0,0,0,0)),
                radial-gradient(0.6px 0.6px at 23% 28%, #ffe, rgba(0,0,0,0)),
                radial-gradient(0.5px 0.5px at 86% 95%, #fff, rgba(0,0,0,0)),
                radial-gradient(0.8px 0.8px at 55% 36%, #d4e4ff, rgba(0,0,0,0)),
                radial-gradient(0.6px 0.6px at 34% 4%, #fff, rgba(0,0,0,0)),
                radial-gradient(0.5px 0.5px at 77% 58%, #ffd, rgba(0,0,0,0)),
                radial-gradient(0.7px 0.7px at 4% 20%, #fff, rgba(0,0,0,0)),
                radial-gradient(0.5px 0.5px at 94% 66%, #ffe, rgba(0,0,0,0)),
                radial-gradient(0.6px 0.6px at 45% 74%, #fff, rgba(0,0,0,0));
            background-repeat: repeat;
            background-size:
                317px 283px, 431px 359px, 251px 331px, 389px 271px, 467px 293px,
                337px 421px, 241px 347px, 409px 293px, 431px 379px,
                157px 173px, 137px 149px, 181px 193px, 127px 139px, 167px 191px,
                211px 223px, 149px 163px, 179px 197px, 193px 181px, 229px 241px,
                151px 139px, 137px 127px,
                103px 97px, 89px 83px, 107px 101px, 97px 109px, 79px 73px,
                113px 103px, 83px 97px, 127px 109px, 91px 89px, 131px 127px,
                101px 97px, 89px 83px, 107px 97px, 113px 79px, 83px 107px,
                109px 89px, 97px 113px, 79px 97px, 101px 83px, 89px 109px;
            opacity: 0.75;
        }
        #layout {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 20px;
            padding: 30px;
            z-index: 1;
        }
        .item {
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .item img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .controls {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            display: flex;
            gap: 20px;
        }
        .controls button {
            background: #211843;
            color: #4AF6F4;
            border: 1px solid #FFD700;
            border-radius: 30px;
            padding: 10px 25px;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(74, 246, 244, 0.4);
            transition: 0.3s;
        }
        .controls button:hover {
            background: #4AF6F4;
            color: #0a1128;
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.8);
        }
        #title {
            position: fixed;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: #b8a310;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(184, 163, 16, 0.6);
            letter-spacing: 5px;
            z-index: 100;
        }
    </style>
</head>
<body>
    <div id="title">✦ Light Hall ✦</div>
    <div id="layout"></div>
    <div class="controls">
        <button onclick="prevPage()">◀ Prev</button>
        <button onclick="nextPage()">Next ▶</button>
    </div>

    <script>
        const layout = document.getElementById('layout');
        const colors = [
            [255, 193, 7],  // 金色
            [168, 85, 247], // 紫色
            [0, 255, 255],  // 青色
            [255, 64, 192], // 洋红
            [74, 246, 244]  // 蓝宝石
        ];
        let allImages = [];

        async function getAllImages() {
            try {
                let response = await fetch('https://api.github.com/repos/fortunecord/fortunecord-artworks/git/trees/main?recursive=1');
                if (!response.ok) {
                    response = await fetch('https://api.github.com/repos/fortunecord/fortunecord-artworks/git/trees/master?recursive=1');
                }
                let data = await response.json();
                let paths = data.tree.map(item => item.path);
                allImages = paths.filter(path => /\.(jpg|jpeg|png)$/i.test(path));
            } catch (error) {
                allImages = [
                    "https://fortunecord.github.io/fortunecord-artworks/1-taiji-collection/1-fortune-cord-taiji-v1.0/fortune-cord-post-heaven-taiji-single-strand-outer-ring-yin-yang-s-curve.jpg"
                ];
            }
        }

        function getRandomColor() {
            return colors[Math.floor(Math.random() * colors.length)];
        }

        function render() {
            layout.innerHTML = '';
            if (allImages.length === 0) return;
            let count = 20;
            for (let i = 0; i < count; i++) {
                let item = document.createElement('div');
                item.className = 'item';
                let colSpan = Math.floor(Math.random() * 3) + 1;  // 1-3列
                let rowSpan = Math.floor(Math.random() * 2) + 1;  // 1-2行
                item.style.gridColumn = 'span ' + colSpan;
                item.style.gridRow = 'span ' + rowSpan;

                let img = document.createElement('img');
                let randomPath = allImages[Math.floor(Math.random() * allImages.length)];
                img.src = 'https://fortunecord.github.io/fortunecord-artworks/' + randomPath;
                let color1 = getRandomColor();
                let color2 = getRandomColor();
                img.style.filter = `invert(1) drop-shadow(0 0 8px rgba(${color1[0]},${color1[1]},${color1[2]},0.8)) drop-shadow(0 0 20px rgba(${color2[0]},${color2[1]},${color2[2]},0.6))`;
                item.appendChild(img);
                layout.appendChild(item);
            }
        }

        function prevPage() { render(); }
        function nextPage() { render(); }

        getAllImages().then(render);
    </script>
</body>
</html>
