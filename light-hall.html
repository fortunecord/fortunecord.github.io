<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>光影馆 – FortuneCord</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: radial-gradient(circle at 50% 50%, #1a103c 0%, #0a1128 70%);
            font-family: sans-serif;
            overflow-x: hidden;
        }
        #layout {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }
        .item {
            position: absolute;
            mix-blend-mode: multiply;
            object-fit: contain;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .controls {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            display: flex;
            gap: 20px;
        }
        .controls button {
            background: #211843;
            color: #4AF6F4;
            border: 1px solid #FFD700;
            border-radius: 30px;
            padding: 10px 25px;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(74, 246, 244, 0.4);
            transition: 0.3s;
        }
        .controls button:hover {
            background: #4AF6F4;
            color: #0a1128;
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.8);
        }
        #title {
            position: fixed;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: #b8a310;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(184, 163, 16, 0.6);
            letter-spacing: 5px;
            z-index: 100;
        }
    </style>
</head>
<body>
    <div id="title">✦ 光影馆 ✦</div>
    <div id="layout"></div>
    <div class="controls">
        <button onclick="prevPage()">◀ 上一页</button>
        <button onclick="nextPage()">下一页 ▶</button>
    </div>

    <script>
        // 以下链接均指向您的第2个仓库（图库仓库），您可以从图库里复制更多精美图片链接粘贴进来
        const images = [
            "https://fortunecord.github.io/fortunecord-artworks/1-taiji-collection/1-fortune-cord-taiji-v1.0/fortune-cord-post-heaven-taiji-single-strand-outer-ring-yin-yang-s-curve.jpg",
            "https://fortunecord.github.io/fortunecord-artworks/6-big-dipper-collection/3-fortune-cord-big-dipper-seven-pets-v1.0-1.8/v1.1-two-eared-beast-front-back/coin-cord-big-dipper-coins-fluffy-tail.jpg",
            "https://fortunecord.github.io/fortunecord-artworks/12-fortune-craft/money-tree-multi-variant-coins.jpg",
            "https://fortunecord.github.io/fortunecord-artworks/10-stellar-radiance/star-coin-pulse-floral-perforation-round-coin-water-ripple-ray.jpg"
        ];

        const layout = document.getElementById('layout');
        const colors = [
            "hue-rotate(140deg) saturate(3)",
            "hue-rotate(240deg) saturate(3)",
            "hue-rotate(20deg) saturate(3)",
            "hue-rotate(320deg) saturate(3)",
            "hue-rotate(60deg) saturate(3)",
        ];

        function render() {
            layout.innerHTML = '';
            let imgCount = 20;
            for (let i = 0; i < imgCount; i++) {
                const img = document.createElement('img');
                img.src = images[Math.floor(Math.random() * images.length)];
                img.className = 'item';
                const size = Math.floor(Math.random() * 300) + 100;
                img.style.width = size + 'px';
                img.style.maxWidth = '20vw';
                img.style.left = Math.random() * 90 + 'vw';
                img.style.top = Math.random() * 90 + 'vh';
                img.style.transform = 'rotate(' + (Math.random() * 60 - 30) + 'deg)';
                const color = colors[Math.floor(Math.random() * colors.length)];
                img.style.filter = "invert(1) sepia(1) " + color;
                layout.appendChild(img);
            }
        }

        function prevPage() { render(); }
        function nextPage() { render(); }

        render();
    </script>
</body>
</html>
