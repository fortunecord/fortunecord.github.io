<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>光影馆 – FortuneCord</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: radial-gradient(circle at 50% 50%, #1a103c 0%, #0a1128 70%);
            font-family: sans-serif;
            overflow-x: hidden;
        }
        #layout {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }
        .item {
            position: absolute;
            mix-blend-mode: screen;
            object-fit: contain;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .controls {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            display: flex;
            gap: 20px;
        }
        .controls button {
            background: #211843;
            color: #4AF6F4;
            border: 1px solid #FFD700;
            border-radius: 30px;
            padding: 10px 25px;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(74, 246, 244, 0.4);
            transition: 0.3s;
        }
        .controls button:hover {
            background: #4AF6F4;
            color: #0a1128;
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.8);
        }
        #title {
            position: fixed;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: #b8a310;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(184, 163, 16, 0.6);
            letter-spacing: 5px;
            z-index: 100;
        }
    </style>
</head>
<body>
    <div id="title">✦ 光影馆 ✦</div>
    <div id="layout"></div>
    <div class="controls">
        <button onclick="prevPage()">◀ 上一页</button>
        <button onclick="nextPage()">下一页 ▶</button>
    </div>

    <script>
        const layout = document.getElementById('layout');
        const colors = [
            "hue-rotate(140deg) saturate(3)",
            "hue-rotate(240deg) saturate(3)",
            "hue-rotate(20deg) saturate(3)",
            "hue-rotate(320deg) saturate(3)",
            "hue-rotate(60deg) saturate(3)"
        ];
        let allImages = [];

        async function getAllImages() {
            try {
                let response = await fetch('https://api.github.com/repos/fortunecord/fortunecord-artworks/git/trees/main?recursive=1');
                if (!response.ok) {
                    response = await fetch('https://api.github.com/repos/fortunecord/fortunecord-artworks/git/trees/master?recursive=1');
                }
                let data = await response.json();
                let paths = data.tree.map(item => item.path);
                allImages = paths.filter(path => /\.(jpg|jpeg|png)$/i.test(path));
            } catch (error) {
                allImages = [
                    "https://fortunecord.github.io/fortunecord-artworks/1-taiji-collection/1-fortune-cord-taiji-v1.0/fortune-cord-post-heaven-taiji-single-strand-outer-ring-yin-yang-s-curve.jpg"
                ];
            }
        }

        function render() {
            layout.innerHTML = '';
            if (allImages.length === 0) return;
            let imgCount = Math.min(20, allImages.length);
            for (let i = 0; i < imgCount; i++) {
                let img = document.createElement('img');
                let randomPath = allImages[Math.floor(Math.random() * allImages.length)];
                img.src = 'https://fortunecord.github.io/fortunecord-artworks/' + randomPath;
                img.className = 'item';
                img.style.width = (Math.floor(Math.random() * 300) + 100) + 'px';
                img.style.maxWidth = '20vw';
                img.style.left = Math.random() * 90 + 'vw';
                img.style.top = Math.random() * 90 + 'vh';
                img.style.transform = 'rotate(' + (Math.random() * 60 - 30) + 'deg)';
                img.style.filter = "invert(1) sepia(1) " + colors[Math.floor(Math.random() * colors.length)];
                layout.appendChild(img);
            }
        }

        function prevPage() { render(); }
        function nextPage() { render(); }

        getAllImages().then(render);
    </script>
</body>
</html>
