              radial-gradient(1.1px 1.1px at 62% 28%, #ffe, rgba(0,0,0,0)),
              radial-gradient(0.9px 0.9px at 33% 58%, #d4e4ff, rgba(0,0,0,0)),
              radial-gradient(1.2px 1.2px at 59% 80%, #fff, rgba(0,0,0,0)),

              radial-gradient(1.4px 1.4px at 24% 73%, #fff, rgba(0,0,0,0)),

              radial-gradient(0.5px 0.5px at 29% 88%, #fff, rgba(0,0,0,0)),
              radial-gradient(0.8px 0.8px at 88% 34%, #d4e4ff, rgba(0,0,0,0)),
              radial-gradient(0.6px 0.6px at 37% 64%, #fff, rgba(0,0,0,0)),
              radial-gradient(0.7px 0.7px at 63% 91%, #ffd, rgba(0,0,0,0)),
              radial-gradient(0.5px 0.5px at 11% 87%, #ffe, rgba(0,0,0,0)),

              radial-gradient(0.6px 0.6px at 34% 4%, #fff, rgba(0,0,0,0)),
              radial-gradient(0.5px 0.5px at 77% 58%, #ffd, rgba(0,0,0,0)),
              radial-gradient(0.7px 0.7px at 4% 20%, #fff, rgba(0,0,0,0)),
              radial-gradient(0.5px 0.5px at 94% 66%, #ffe, rgba(0,0,0,0)),
              radial-gradient(0.6px 0.6px at 45% 74%, #fff, rgba(0,0,0,0));

            background-repeat: repeat;
            /* 关键：使用互质数尺寸，彻底打破网格规律，解决“三点一线”问题 */
            background-size:
                317px 283px, 431px 359px, 251px 331px, 389px 271px, 467px 293px,
                337px 421px, 241px 347px, 409px 293px, 431px 379px,
                157px 173px, 137px 149px, 181px 193px, 127px 139px, 167px 191px,
                211px 223px, 149px 163px, 179px 197px, 193px 181px, 229px 241px,
                151px 139px, 137px 127px,
                103px 97px, 89px 83px, 107px 101px, 97px 109px, 79px 73px,
                113px 103px, 83px 97px, 127px 109px, 91px 89px, 131px 127px,
                101px 97px, 89px 83px, 107px 97px, 113px 79px, 83px 107px,
                109px 89px, 97px 113px, 79px 97px, 101px 83px, 89px 109px;
            opacity: 0.75;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        /* ========== 头部（完全复刻首页） ========== */
        .lang-switch {
            display: flex;
            justify-content: flex-end;
            gap: 0.8rem;
            margin-bottom: 2rem;
            position: relative;
            z-index: 0;
        }
        .lang-btn {
            position: relative;
            width: 35px;
            height: 35px;
            border: 1px solid #b8a310;
            border-radius: 50%;
            background: linear-gradient(145deg, #2b1a5e 0%, #4a3b82 100%);
            color: #b2ebf2;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
            z-index: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            line-height: 1;
            padding: 0;
            box-shadow: 0 0 5px rgba(184, 163, 16, 0.4), inset 0 1px 2px rgba(255, 255, 255, 0.3), inset 0 -2px 3px rgba(0, 0, 0, 0.5);
            text-shadow: 0 0 4px #40E0D0;
        }
        .lang-btn.active {
            background: linear-gradient(145deg, #b8a310 0%, #d4c24a 100%);
            color: #211843;
            border-color: #fff5c2;
            box-shadow: 0 0 8px rgba(255, 215, 0, 0.6), inset 0 1px 2px rgba(255, 255, 255, 0.4), inset 0 -2px 3px rgba(0, 0, 0, 0.2);
            text-shadow: none;
        }
        .lang-btn::after {
            content: '';
            position: absolute;
            width: 16px;
            height: 16px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            background: #746aa8;
            border-radius: 2px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(45deg);
            z-index: -1;
            box-shadow: inset 0 0 4px rgba(0, 0, 0, 0.3);
        }

        .hero {
            text-align: center;
            margin-bottom: 3rem;
        }
        .hero-content {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 1.5rem;
        }
        .logo-img {
            max-width: 100%;
            height: auto;
            max-height: 100px;
            filter: brightness(0.75) saturate(0.8) drop-shadow(0 0 3px rgba(255, 255, 255, 0.5)) drop-shadow(0 0 8px rgba(255, 255, 255, 0.3));
        }
        .hero-text {
            text-align: left;
        }
        .logo {
            font-size: 2.8rem;
            font-weight: 600;
            letter-spacing: -0.5px;
            margin-bottom: 0.2rem;
            color: #b8a310;
        }
        .subtitle-row {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            flex-wrap: wrap;
            margin: 0.2rem 0 0.5rem;
        }
        .subtitle-en {
            font-size: 1.2rem;
            color: #aaa;
        }
        .hero-buttons {
            position: relative;
            display: flex;
            gap: 15px;
            padding: 0 10px;
        }
        .hero-buttons::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 5px;
            right: 5px;
            height: 2px;
            background: linear-gradient(90deg, transparent, #b8a310, transparent);
            z-index: -1;
        }
        .btn-primary {
            position: relative;
            padding: 0.5rem 1.5rem;
            background: #211843;
            color: #b8a310;
            border: 1px solid #FFD700;
            border-radius: 30px;
            font-size: 0.9rem;
            font-weight: 500;
            text-decoration: none;
            transition: all 0.3s;
            box-shadow: 0 0 8px rgba(184, 163, 16, 0.3), inset 0 1px 2px rgba(255, 255, 255, 0.2), inset 0 -2px 3px rgba(0, 0, 0, 0.5);
            text-shadow: 0 0 4px rgba(184, 163, 16, 0.5);
        }
        .btn-primary::after {
            content: '';
            position: absolute;
            width: 8px;
            height: 8px;
            background: #4AF6F4;
            border: 1px solid #FFD700;
            border-radius: 1px;
            top: 50%;
            left: 12px;
            transform: translateY(-50%) rotate(45deg);
            z-index: -1;
        }
        .btn-primary:hover {
            background: linear-gradient(145deg, #b8a310 0%, #d4c24a 100%);
            color: #211843;
            border-color: #fff5c2;
            text-shadow: none;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.6), inset 0 1px 2px rgba(255, 255, 255, 0.4);
        }
        .btn-primary:hover::after {
            background: #211843;
            border-color: #211843;
            box-shadow: 0 0 5px #4AF6F4;
        }
        .tagline {
            font-size: 1rem;
            color: #aaa;
            border-top: 1px solid #333;
            border-bottom: 1px solid #333;
            display: inline-block;
            padding: 0.5rem 0;
            margin-top: 0.5rem;
        }
        /* ========== 头部结束 ========== */

        h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            color: #b8a310;
        }

        .subhead {
            color: #aaa;
            margin-bottom: 2rem;
            border-left: 3px solid #b8a310;
            padding-left: 1rem;
        }

        h2 {
            font-size: 1.5rem;
            margin: 2rem 0 1rem;
            padding-bottom: 0.3rem;
            border-bottom: 1px solid #2a2a2a;
            color: #d4c24a;
        }

        h3 {
            font-size: 1.2rem;
            margin: 1.2rem 0 0.5rem;
            color: #b8a310;
        }

        p {
            margin-bottom: 1em;
            color: #d0d0d0;
        }

        .symbol-block {
            background: rgba(255,255,255,0.04);
            padding: 1rem 1.5rem;
            border-radius: 16px;
            margin: 1.5rem 0;
            border: 1px solid rgba(184,163,16,0.15);
        }

        .symbol-block ul {
            color: #d0d0d0;
            padding-left: 1.5rem;
            margin-top: 0.5rem;
        }

        .symbol-block ul li {
            margin-bottom: 0.3rem;
        }

        footer {
            margin-top: 3rem;
            text-align: center;
            font-size: 0.85rem;
            color: #777;
            border-top: 1px solid #2a2a2a;
            padding-top: 2rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 语言切换（带参数，当前页面内切换） -->
        <div class="lang-switch">
            <a href="/symbols.html?lang=en" class="lang-btn active">EN</a>
            <a href="/symbols.html?lang=zh" class="lang-btn">简</a>
            <a href="/symbols.html?lang=zh-tw" class="lang-btn">繁</a>
        </div>

        <!-- 页头（完全复刻首页） -->
        <div class="hero">
            <div class="hero-content">
                <img src="assets/fortunecord-coin-cord-logo-main.svg" alt="FortuneCord Logo" class="logo-img">
                <div class="hero-text">
                    <h1 class="logo">FortuneCord<span style="font-size:0.5em;">™</span></h1>
                    <div class="subtitle-row">
                        <span class="subtitle-en">An Alchemist's Line Art World</span>
                        <div class="hero-buttons">
                            <a href="https://fortunecord.github.io/fortunecord-artworks/" class="btn-primary">Gallery</a>
                            <a href="/symbols.html?lang=en" class="btn-primary">Symbolism</a>
                            <a href="/legal.html" class="btn-primary">Legal</a>
                        </div>
                    </div>
                </div>
            </div>
            <div class="tagline">Star Coin System — Weave your guardian stars into a thread of fortune.</div>
        </div>

        <!-- 简体中文内容 -->
        <div id="content-zh" class="lang-content" style="display: none;">
            <!-- 原有简体中文内容不变 -->
            <h1>符号释义</h1>
            <div class="subhead">圆币 · 螺旋 · 太极图 · 财富哲学</div>
            <!-- 此处省略原内容，您可以直接粘贴 -->
        </div>

        <!-- 繁体中文内容 -->
        <div id="content-zh-tw" class="lang-content" style="display: none;">
            <!-- 原有繁体中文内容不变 -->
            <h1>符號釋義</h1>
            <div class="subhead">圓幣 · 螺旋 · 太極圖 · 財富哲學</div>
            <!-- 此处省略原内容，您可以直接粘贴 -->
        </div>

        <!-- 英文内容 -->
        <div id="content-en" class="lang-content">
            <!-- 原有英文内容不变 -->
            <h1>Symbolism</h1>
            <div class="subhead">Round Coin · Spiral · Taiji · Wealth Philosophy</div>
            <!-- 此处省略原内容，您可以直接粘贴 -->
        </div>
    </div>

    <script>
        const zhDiv = document.getElementById('content-zh');
        const zhTwDiv = document.getElementById('content-zh-tw');
        const enDiv = document.getElementById('content-en');
        const btns = document.querySelectorAll('.lang-btn');

        function setLang(lang) {
            zhDiv.style.display = 'none';
            zhTwDiv.style.display = 'none';
            enDiv.style.display = 'none';
            if (lang === 'zh') {
                zhDiv.style.display = 'block';
            } else if (lang === 'zh-tw') {
                zhTwDiv.style.display = 'block';
            } else {
                enDiv.style.display = 'block';
            }
            btns.forEach(btn => {
                btn.classList.toggle('active', btn.dataset.lang === lang);
            });
        }

        btns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.preventDefault();
                const lang = btn.dataset.lang;
                setLang(lang);
                history.replaceState(null, '', '?lang=' + lang);
            });
        });

        const urlParams = new URLSearchParams(window.location.search);
        const langParam = urlParams.get('lang');
        if (langParam === 'zh') setLang('zh');
        else if (langParam === 'zh-tw') setLang('zh-tw');
        else setLang('en');
    </script>
</body>
