<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FortuneCord – 星幣 · 鏈金 · 光影</title>

    <link rel="icon" href="/assets/favicon.ico">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', '思源黑體', 'Noto Sans', sans-serif;
            background: #0a1128;
            color: #e0e0e0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            z-index: 0;
            background-image:
                radial-gradient(2px 2px at 13% 24%, #fff, transparent),
                radial-gradient(2.5px 2.5px at 81% 17%, #ffe, transparent),
                radial-gradient(1.5px 1.5px at 39% 83%, #ffd, transparent),
                radial-gradient(2px 2px at 66% 61%, #fff, transparent),
                radial-gradient(1.5px 1.5px at 91% 43%, #d4e4ff, transparent),
                radial-gradient(2.2px 2.2px at 7% 68%, #fff, transparent),
                radial-gradient(1.8px 1.8px at 54% 9%, #ffe, transparent),
                radial-gradient(1.2px 1.2px at 28% 47%, #ffd, transparent),
                radial-gradient(1.8px 1.8px at 74% 92%, #fff, transparent),
                radial-gradient(1px 1px at 18% 11%, #fff, transparent),
                radial-gradient(0.8px 0.8px at 48% 38%, #ffd, transparent),
                radial-gradient(1.1px 1.1px at 85% 67%, #fff, transparent);
            background-repeat: repeat;
            opacity: 0.8;
        }
        .center {
            text-align: center;
            position: relative;
            z-index: 1;
            padding: 2rem;
        }
        h1 {
            font-size: 3rem;
            font-weight: 600;
            color: #C5B98A;
            letter-spacing: -0.5px;
            margin-bottom: 0.5rem;
        }
        .sub {
            font-size: 1rem;
            color: #888;
            letter-spacing: 2px;
            margin-bottom: 3rem;
        }
        .enter {
            display: inline-block;
            padding: 0.8rem 3rem;
            border: 1px solid #b8a310;
            color: #b8a310;
            text-decoration: none;
            font-size: 0.9rem;
            letter-spacing: 4px;
            transition: all 0.4s;
            border-radius: 30px;
        }
        .enter:hover {
            background: #b8a310;
            color: #0a1128;
        }
        .lang {
            position: fixed;
            top: 2rem;
            right: 2rem;
            display: flex;
            gap: 0.5rem;
            z-index: 2;
        }
        .lang a {
            color: #555;
            text-decoration: none;
            font-size: 0.75rem;
            padding: 0.3rem 0.6rem;
            border: 1px solid #333;
            border-radius: 4px;
            transition: all 0.3s;
        }
        .lang a:hover { color: #b8a310; border-color: #b8a310; }
        .lang a.active { color: #b8a310; border-color: #b8a310; }
    </style>
</head>
<body>
    <div class="lang">
        <a href="/">EN</a>

    <div class="center">

        <div class="sub">星幣 · 鏈金 · 光影</div>

    </div>
</body>
