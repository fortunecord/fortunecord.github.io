    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', '思源黑體', 'Noto Sans TC', sans-serif;
            background: #06080f;
            color: #e0e0e0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            z-index: 0;
            background-image:
                radial-gradient(ellipse 60% 70% at 50% 25%, rgba(90, 50, 180, 0.4) 0%, transparent 65%),
                radial-gradient(ellipse 40% 50% at 20% 60%, rgba(40, 100, 180, 0.2) 0%, transparent 65%),
                radial-gradient(ellipse 45% 45% at 80% 70%, rgba(160, 50, 200, 0.18) 0%, transparent 65%),
                radial-gradient(ellipse 35% 30% at 50% 75%, rgba(74, 246, 244, 0.1) 0%, transparent 70%);
            filter: blur(24px);
            animation: nebula-drift 22s ease-in-out infinite;
        }

        body::after {
            content: '';
            position: fixed;
            inset: 0;
            z-index: 0;
            background-image:
                radial-gradient(2.5px 2.5px at 13% 24%, #fff, transparent),
                radial-gradient(3px 3px at 81% 17%, #ffe, transparent),
                radial-gradient(2px 2px at 39% 83%, #ffd, transparent),
                radial-gradient(2.5px 2.5px at 66% 61%, #fff, transparent),
                radial-gradient(1.8px 1.8px at 91% 43%, #d4e4ff, transparent),
                radial-gradient(2.8px 2.8px at 7% 68%, #fff, transparent),
                radial-gradient(2.2px 2.2px at 54% 9%, #ffe, transparent),
                radial-gradient(1.6px 1.6px at 28% 47%, #ffd, transparent),
                radial-gradient(2.2px 2.2px at 74% 92%, #fff, transparent),
                radial-gradient(1.2px 1.2px at 18% 11%, #fff, transparent),
                radial-gradient(1px 1px at 48% 38%, #ffd, transparent),
                radial-gradient(1.3px 1.3px at 85% 67%, #fff, transparent),
                radial-gradient(1.1px 1.1px at 62% 28%, #ffe, transparent),
                radial-gradient(0.9px 0.9px at 33% 58%, #d4e4ff, transparent),
                radial-gradient(1.2px 1.2px at 59% 80%, #fff, transparent),
                radial-gradient(1px 1px at 96% 15%, #ffd, transparent),
                radial-gradient(1.4px 1.4px at 24% 73%, #fff, transparent),
                radial-gradient(1px 1px at 71% 49%, #ffe, transparent),
                radial-gradient(1.2px 1.2px at 43% 22%, #fff, transparent),
                radial-gradient(0.8px 0.8px at 6% 49%, #ffd, transparent),
                radial-gradient(0.6px 0.6px at 15% 35%, #fff, transparent),
                radial-gradient(0.8px 0.8px at 47% 55%, #ffd, transparent),
                radial-gradient(0.5px 0.5px at 79% 77%, #fff, transparent),
                radial-gradient(0.7px 0.7px at 52% 16%, #ffe, transparent),
                radial-gradient(0.5px 0.5px at 29% 88%, #fff, transparent),
                radial-gradient(0.8px 0.8px at 88% 34%, #d4e4ff, transparent),
                radial-gradient(0.6px 0.6px at 37% 64%, #fff, transparent),
                radial-gradient(0.7px 0.7px at 63% 91%, #ffd, transparent),
                radial-gradient(0.5px 0.5px at 11% 87%, #ffe, transparent),
                radial-gradient(0.8px 0.8px at 91% 8%, #fff, transparent),
                radial-gradient(0.5px 0.5px at 41% 42%, #ffd, transparent),

                radial-gradient(0.6px 0.6px at 34% 4%, #fff, transparent),
                radial-gradient(0.5px 0.5px at 77% 58%, #ffd, transparent),
                radial-gradient(0.7px 0.7px at 4% 20%, #fff, transparent),
                radial-gradient(0.5px 0.5px at 94% 66%, #ffe, transparent),
                radial-gradient(0.6px 0.6px at 45% 74%, #fff, transparent);
            background-repeat: repeat;
            background-size:
                951px 849px, 1293px 1077px, 753px 993px, 1167px 813px, 1401px 879px,
                1011px 1263px, 723px 1041px, 1227px 879px, 1293px 1137px,
                471px 519px, 411px 447px, 543px 579px, 381px 417px, 501px 573px,
                633px 669px, 447px 489px, 537px 591px, 579px 543px, 687px 723px,
                453px 417px, 411px 381px,
                309px 291px, 267px 249px, 321px 303px, 291px 327px, 237px 219px,
                339px 309px, 249px 291px, 381px 327px, 273px 267px, 393px 381px,
                303px 291px, 267px 249px, 321px 291px, 339px 237px, 249px 321px,
                327px 267px, 291px 339px, 237px 291px, 303px 249px, 267px 327px;
            opacity: 0.85;
            animation: stars-twinkle 7s ease-in-out infinite;
        }

        @keyframes nebula-drift {
            0%, 100% { opacity: 0.9; transform: scale(1) translateY(0); }
            50% { opacity: 1; transform: scale(1.06) translateY(-10px); }
        }

        @keyframes stars-twinkle {
            0%, 100% { opacity: 0.85; }
            50% { opacity: 0.55; }
        }

        .cord-vertical {
            position: fixed;
            top: 0;
            left: 50%;
            width: 110px;
            height: 100%;
            margin-left: -55px;
            background-image: repeating-linear-gradient(
                0deg,
                transparent 0,
                transparent 10px,
                rgba(197, 185, 138, 0.55) 10px,
                rgba(197, 185, 138, 0.55) 11px,
                transparent 11px,
                transparent 20px,
                rgba(74, 246, 244, 0.32) 20px,
                rgba(74, 246, 244, 0.32) 21px,
                transparent 21px,
                transparent 30px
            );
            -webkit-mask-image: linear-gradient(180deg, transparent 0%, black 12%, black 88%, transparent 100%);
            mask-image: linear-gradient(180deg, transparent 0%, black 12%, black 88%, transparent 100%);
            box-shadow:
                0 0 30px rgba(197, 185, 138, 0.25),
                0 0 60px rgba(120, 80, 220, 0.15);
            animation: cord-fall 22s linear infinite;
            pointer-events: none;
            z-index: 1;
            opacity: 0.7;
        }

        @keyframes cord-fall {
            0% { background-position: 0 0; }
            100% { background-position: 0 300px; }
        }

        .arcs {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
        }

        .arcs path {
            animation: arc-pulse 12s ease-in-out infinite;
        }

        .arcs path:nth-child(2) {
            animation-delay: 3s;
        }

        @keyframes arc-pulse {
            0%, 100% { opacity: 0.35; }
            50% { opacity: 0.75; }
        }

        .coin-dots {
            position: fixed;
            top: 0;
            left: 50%;
            width: 0;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        .coin-dots span {
            position: absolute;
            left: 50%;
            width: 16px;
            height: 16px;
            margin-left: -8px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 248, 210, 1) 0%, rgba(197, 185, 138, 0.55) 45%, transparent 75%);
            box-shadow:
                0 0 14px rgba(255, 235, 170, 0.95),
                0 0 32px rgba(255, 235, 170, 0.55);
            animation: coin-pulse 4.5s ease-in-out infinite;
        }

        .coin-dots span:nth-child(1) { top: 8%; animation-delay: 0s; }
        .coin-dots span:nth-child(2) { top: 22%; animation-delay: 0.7s; background: radial-gradient(circle, rgba(200, 250, 255, 1) 0%, rgba(74, 246, 244, 0.55) 45%, transparent 75%); box-shadow: 0 0 14px rgba(74, 246, 244, 0.9), 0 0 32px rgba(74, 246, 244, 0.5); }
        .coin-dots span:nth-child(3) { top: 36%; animation-delay: 1.4s; }
        .coin-dots span:nth-child(4) { top: 64%; animation-delay: 2.1s; background: radial-gradient(circle, rgba(255, 210, 245, 1) 0%, rgba(255, 64, 192, 0.55) 45%, transparent 75%); box-shadow: 0 0 14px rgba(255, 64, 192, 0.9), 0 0 32px rgba(255, 64, 192, 0.5); }
        .coin-dots span:nth-child(5) { top: 78%; animation-delay: 2.8s; }
        .coin-dots span:nth-child(6) { top: 92%; animation-delay: 3.5s; background: radial-gradient(circle, rgba(200, 250, 255, 1) 0%, rgba(74, 246, 244, 0.55) 45%, transparent 75%); box-shadow: 0 0 14px rgba(74, 246, 244, 0.9), 0 0 32px rgba(74, 246, 244, 0.5); }

        @keyframes coin-pulse {
            0%, 100% { opacity: 0.65; transform: scale(0.85); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        .horizon {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 260px;
            background: radial-gradient(
                ellipse at center bottom,
                rgba(120, 80, 220, 0.28) 0%,
                rgba(60, 40, 120, 0.14) 40%,
                transparent 75%
            );
            pointer-events: none;
            z-index: 1;
        }

        .vignette {
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse at center, transparent 38%, rgba(0, 0, 0, 0.5) 100%),
                linear-gradient(180deg, rgba(0, 0, 0, 0.4) 0%, transparent 20%, transparent 78%, rgba(0, 0, 0, 0.35) 100%);
            pointer-events: none;
            z-index: 3;
        }

        .floaters {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 1;
        }

        .floater {
            position: absolute;
            width: 6px;
            height: 6px;
            transform: rotate(45deg);
            border-radius: 1px;
        }

        .f1 {
            top: 22%;
            left: 18%;
            background: rgba(255, 235, 170, 0.95);
            box-shadow: 0 0 10px rgba(255, 235, 170, 0.9), 0 0 22px rgba(255, 235, 170, 0.5);
            animation: drift-a 16s ease-in-out infinite;
        }

        .f2 {
            top: 35%;
            left: 80%;
            background: rgba(74, 246, 244, 0.95);
            box-shadow: 0 0 10px rgba(74, 246, 244, 0.9), 0 0 22px rgba(74, 246, 244, 0.5);
            animation: drift-b 20s ease-in-out infinite;
        }

        .f3 {
            top: 70%;
            left: 22%;
            background: rgba(255, 64, 192, 0.9);
            box-shadow: 0 0 12px rgba(255, 64, 192, 0.85), 0 0 26px rgba(255, 64, 192, 0.45);
            animation: drift-c 22s ease-in-out infinite;
        }

        .f4 {
            top: 82%;
            left: 76%;
            background: rgba(255, 235, 170, 0.95);
            box-shadow: 0 0 10px rgba(255, 235, 170, 0.9), 0 0 22px rgba(255, 235, 170, 0.5);
            animation: drift-d 18s ease-in-out infinite;
        }

        .f5 {
            top: 15%;
            left: 62%;
            width: 4px;
            height: 4px;
            background: rgba(74, 246, 244, 0.9);
            box-shadow: 0 0 8px rgba(74, 246, 244, 0.9), 0 0 18px rgba(74, 246, 244, 0.5);
            animation: drift-b 24s ease-in-out infinite reverse;
        }

        .f6 {
            top: 88%;
            left: 40%;
            width: 4px;
            height: 4px;
            background: rgba(255, 64, 192, 0.9);
            box-shadow: 0 0 8px rgba(255, 64, 192, 0.85), 0 0 18px rgba(255, 64, 192, 0.45);
            animation: drift-a 21s ease-in-out infinite reverse;
        }

        @keyframes drift-a {
            0%, 100% { transform: rotate(45deg) translate(0, 0); opacity: 0.7; }
            50% { transform: rotate(225deg) translate(18px, -22px); opacity: 1; }
        }

        @keyframes drift-b {
            0%, 100% { transform: rotate(45deg) translate(0, 0); opacity: 0.6; }
            50% { transform: rotate(225deg) translate(-22px, 20px); opacity: 1; }
        }

        @keyframes drift-c {
            0%, 100% { transform: rotate(45deg) translate(0, 0); opacity: 0.75; }
            50% { transform: rotate(225deg) translate(-15px, -25px); opacity: 1; }
        }

        @keyframes drift-d {
            0%, 100% { transform: rotate(45deg) translate(0, 0); opacity: 0.6; }
            50% { transform: rotate(225deg) translate(20px, 22px); opacity: 1; }
        }

        .center {
            text-align: center;
            position: relative;
            z-index: 4;
            padding: 2rem;
        }

        h1 {
            font-size: 3.2rem;
            font-weight: 600;
            color: #C5B98A;
            letter-spacing: 10px;
            margin-bottom: 0.8rem;
            text-shadow:
                0 0 20px rgba(197, 185, 138, 0.55),
                0 0 60px rgba(120, 80, 220, 0.35);
            animation: title-glow 6s ease-in-out infinite;
        }

        @keyframes title-glow {
            0%, 100% {
                text-shadow:
                    0 0 20px rgba(197, 185, 138, 0.55),
                    0 0 60px rgba(120, 80, 220, 0.35);
            }
            50% {
                text-shadow:
                    0 0 32px rgba(197, 185, 138, 0.8),
                    0 0 80px rgba(74, 246, 244, 0.45);
            }
        }

        .sub {
            font-size: 0.85rem;
            color: #aaa;
            letter-spacing: 8px;
            margin-bottom: 4rem;
            opacity: 0.9;
        }

        .enter {
            display: inline-block;
            position: relative;
            padding: 0.7rem 3rem;
            background: rgba(184, 163, 16, 0.05);
            border: 1px solid rgba(184, 163, 16, 0.5);
            color: #d4c24a;
            text-decoration: none;
            font-size: 0.8rem;
            letter-spacing: 10px;
            border-radius: 40px;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            transition: all 0.5s ease;
            overflow: hidden;
            box-shadow:
                0 0 25px rgba(184, 163, 16, 0.15),
                inset 0 0 15px rgba(184, 163, 16, 0.08);
        }

        .enter::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 245, 194, 0.3), transparent);
            transition: left 0.7s ease;
        }

        .enter:hover::before {
            left: 100%;
        }

        .enter:hover {
            background: rgba(184, 163, 16, 0.18);
            border-color: rgba(184, 163, 16, 0.9);
            color: #fff5c2;
            box-shadow:
                0 0 40px rgba(184, 163, 16, 0.45),
                inset 0 0 25px rgba(184, 163, 16, 0.2);
            letter-spacing: 12px;
        }

        .bottom {
            position: fixed;
            bottom: 1.5rem;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 0.7rem;
            color: #444;
            letter-spacing: 2px;
            z-index: 5;
        }

        .lang {
            position: fixed;
            top: 2rem;
            right: 2rem;
            display: flex;
            gap: 0.5rem;
            z-index: 5;
        }

        .lang a {
            color: #555;
            text-decoration: none;
            font-size: 0.75rem;
            padding: 0.35rem 0.7rem;
            border: 1px solid #2a2a2a;
            border-radius: 4px;
            transition: all 0.3s;
        }

        .lang a:hover { color: #b8a310; border-color: #b8a310; }
        .lang a.active { color: #d4c24a; border-color: #b8a310; background: rgba(184, 163, 16, 0.08); }

        @media (max-width: 640px) {
            h1 { font-size: 2.2rem; letter-spacing: 6px; }
            .sub { font-size: 0.72rem; letter-spacing: 5px; margin-bottom: 3rem; }
            .enter { padding: 0.6rem 2rem; letter-spacing: 6px; }
            .enter:hover { letter-spacing: 8px; }
            .cord-vertical { width: 80px; margin-left: -40px; }
            .coin-dots span { width: 12px; height: 12px; margin-left: -6px; }
        }
