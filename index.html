        /* 流星层 */
        .meteor {
            position: fixed;
            width: 120px;
            height: 1.5px;
            background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,0.9));
            border-radius: 50%;
            transform: rotate(-45deg);
            opacity: 0;
            z-index: 1;
            box-shadow: 0 0 8px rgba(255,255,255,0.6);
        }
        .meteor-1 {
            top: 8%;
            right: -150px;
            animation: shoot 8s linear infinite;
            animation-delay: 2s;
        }
        .meteor-2 {
            top: 35%;
            right: -150px;
            animation: shoot 10s linear infinite;
            animation-delay: 7s;
        }
        @keyframes shoot {
            0% { transform: translate(0, 0) rotate(-45deg); opacity: 0; }
            10% { opacity: 1; }
            70% { opacity: 1; }
            85% { transform: translate(-130vw, 130vh) rotate(-45deg); opacity: 0; }
            100% { transform: translate(-130vw, 130vh) rotate(-45deg); opacity: 0; }
        }

        /* 中央内容 */
        .center {
            text-align: center;
            position: relative;
            z-index: 2;
            padding: 2rem;
        }
        h1 {
            font-size: 3rem;
            font-weight: 600;
            color: #C5B98A;
            letter-spacing: -0.5px;
            margin-bottom: 0.5rem;

        .sub {
            font-size: 0.9rem;
            color: #888;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 3.5rem;
        }

        /* 灵动 ENTER 按钮 */
        .enter {
            display: inline-block;
            padding: 0.6rem 2.4rem;
            background: rgba(184, 163, 16, 0.06);
            border: 1px solid rgba(184, 163, 16, 0.45);
            color: #d4c24a;
            text-decoration: none;
            font-size: 0.8rem;
            letter-spacing: 5px;
            text-transform: uppercase;
            border-radius: 30px;
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            transition: all 0.5s ease;
            animation: float 5s ease-in-out infinite;
            box-shadow:
                0 0 20px rgba(184, 163, 16, 0.15),
                inset 0 0 12px rgba(184, 163, 16, 0.08);
        }
        .enter:hover {
            background: rgba(184, 163, 16, 0.18);
            border-color: rgba(184, 163, 16, 0.85);
            color: #fff5c2;
            box-shadow:
                0 0 30px rgba(184, 163, 16, 0.4),
                inset 0 0 20px rgba(184, 163, 16, 0.2);
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        /* 语言切换 */
        .lang {
            position: fixed;
            top: 2rem;
            right: 2rem;
            display: flex;
            gap: 0.5rem;
            z-index: 3;
        }
        .lang a {
            color: #555;
            text-decoration: none;
            font-size: 0.75rem;
            padding: 0.3rem 0.6rem;
            border: 1px solid #333;
            border-radius: 4px;
            transition: all 0.3s;
        }
        .lang a:hover { color: #b8a310; border-color: #b8a310; }
        .lang a.active { color: #b8a310; border-color: #b8a310; }
