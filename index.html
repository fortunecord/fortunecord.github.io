                633px 669px, 447px 489px, 537px 591px, 579px 543px, 687px 723px,

        @keyframes nebula-flow {
            0%, 100% { opacity: 0.9; transform: scale(1) rotate(0deg); }
            50% { opacity: 1; transform: scale(1.08) rotate(2deg); }
        }

        @keyframes stars-flicker {

            50% { opacity: 0.62; }

        .star-burst {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 900px;
            height: 900px;
            margin: -450px 0 0 -450px;
            pointer-events: none;
            z-index: 1;
            animation: burst-breathe 8s ease-in-out infinite;
        }

        .star-burst span {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 2px;
            height: 250px;
            margin-left: -1px;
            background: linear-gradient(180deg,
                transparent 0%,
                rgba(197, 185, 138, 0.65) 45%,
                rgba(197, 185, 138, 0.05) 100%);
            transform-origin: top center;
            transform: translateY(-50%) rotate(0deg) translateY(-250px);
            filter: blur(0.4px);
        }

        .star-burst span:nth-child(1) { transform: translateY(-50%) rotate(0deg) translateY(-250px); }
        .star-burst span:nth-child(2) { transform: translateY(-50%) rotate(30deg) translateY(-250px); }
        .star-burst span:nth-child(3) { transform: translateY(-50%) rotate(60deg) translateY(-250px); background: linear-gradient(180deg, transparent, rgba(74, 246, 244, 0.55), transparent); }
        .star-burst span:nth-child(4) { transform: translateY(-50%) rotate(90deg) translateY(-250px); }
        .star-burst span:nth-child(5) { transform: translateY(-50%) rotate(120deg) translateY(-250px); background: linear-gradient(180deg, transparent, rgba(255, 64, 192, 0.45), transparent); }
        .star-burst span:nth-child(6) { transform: translateY(-50%) rotate(150deg) translateY(-250px); }
        .star-burst span:nth-child(7) { transform: translateY(-50%) rotate(180deg) translateY(-250px); background: linear-gradient(180deg, transparent, rgba(74, 246, 244, 0.55), transparent); }

        @keyframes burst-breathe {
            0%, 100% { opacity: 0.55; transform: scale(1); }
            50% { opacity: 0.85; transform: scale(1.04); }
        }

        .coin-outline {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 360px;
            height: 360px;
            margin: -180px 0 0 -180px;
            border-radius: 50%;
            border: 1px solid rgba(197, 185, 138, 0.18);
            pointer-events: none;
            z-index: 1;
            animation: coin-rotate 90s linear infinite;
        }

        .coin-outline::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 88px;
            height: 88px;
            margin: -44px 0 0 -44px;
            border: 1px solid rgba(74, 246, 244, 0.25);
            border-radius: 4px;
            transform: rotate(45deg);
            box-shadow: 0 0 20px rgba(74, 246, 244, 0.18);
        }

        .coin-outline::after {
            content: '';
            position: absolute;
            inset: 22px;
            border-radius: 50%;
            border: 1px dashed rgba(255, 64, 192, 0.18);
        }

        @keyframes coin-rotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .rings {
            position: fixed;
            top: 50%;
            left: 50%;
            pointer-events: none;
            z-index: 1;
        }

        .ring {
            position: absolute;
            top: 50%;
            left: 50%;
            border-radius: 50%;
            border: 1px solid transparent;
            transform: translate(-50%, -50%);
        }

        .ring-1 {
            width: 560px;
            height: 560px;
            border-top-color: rgba(120, 80, 220, 0.38);
            border-right-color: rgba(120, 80, 220, 0.05);
            animation: ring-spin-1 80s linear infinite;
        }

        .ring-2 {
            width: 720px;
            height: 720px;
            border-bottom-color: rgba(74, 246, 244, 0.3);
            border-left-color: rgba(74, 246, 244, 0.05);
            animation: ring-spin-2 120s linear infinite reverse;
        }

        .ring-3 {
            width: 440px;
            height: 440px;
            border-left-color: rgba(255, 64, 192, 0.28);
            border-bottom-color: rgba(255, 64, 192, 0.05);
            animation: ring-spin-3 70s linear infinite;
        }

        @keyframes ring-spin-1 {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }
        @keyframes ring-spin-2 {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }
        @keyframes ring-spin-3 {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }

        .horizon {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 240px;
            background: radial-gradient(
                ellipse at center bottom,
                rgba(80, 50, 180, 0.3) 0%,
                rgba(40, 30, 100, 0.15) 40%,
                transparent 75%
            );
            pointer-events: none;
            z-index: 1;
        }

        .vignette {
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse at center, transparent 40%, rgba(0, 0, 0, 0.48) 100%),
                linear-gradient(180deg, rgba(0, 0, 0, 0.38) 0%, transparent 22%, transparent 78%, rgba(0, 0, 0, 0.32) 100%);
            pointer-events: none;
            z-index: 3;
        }

        .sparkles {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 1;
        }

        .sparkle {
            position: absolute;
            width: 3px;
            height: 3px;
            background: #fff;
            border-radius: 50%;
            animation: sparkle-blink 5s ease-in-out infinite;
        }

        .s2 { top: 32%; left: 82%; box-shadow: 0 0 8px rgba(74, 246, 244, 0.9), 0 0 20px rgba(74, 246, 244, 0.5); animation-delay: 0.6s; background: #c8faff; }
        .s3 { top: 72%; left: 20%; box-shadow: 0 0 10px rgba(255, 64, 192, 0.9), 0 0 22px rgba(255, 64, 192, 0.5); animation-delay: 1.2s; background: #ffd0e8; }
        .s4 { top: 80%; left: 76%; box-shadow: 0 0 8px rgba(255, 235, 170, 0.9), 0 0 20px rgba(255, 235, 170, 0.5); animation-delay: 1.8s; }

        .s6 { top: 88%; left: 42%; box-shadow: 0 0 10px rgba(255, 64, 192, 0.9), 0 0 22px rgba(255, 64, 192, 0.5); animation-delay: 3s; background: #ffd0e8; }
        .s7 { top: 46%; left: 8%; box-shadow: 0 0 8px rgba(255, 235, 170, 0.9), 0 0 20px rgba(255, 235, 170, 0.5); animation-delay: 3.6s; }
        .s8 { top: 58%; left: 92%; box-shadow: 0 0 8px rgba(74, 246, 244, 0.9), 0 0 20px rgba(74, 246, 244, 0.5); animation-delay: 4.2s; background: #c8faff; }

        @keyframes sparkle-blink {
            0%, 100% { opacity: 0.25; transform: scale(0.7); }
            50% { opacity: 1; transform: scale(1.3); }
        }

            margin-bottom: 0.6rem;

            font-size: 0.78rem;
            color: #aaa;
            letter-spacing: 6px;
            text-transform: uppercase;
            margin-bottom: 4rem;
            opacity: 0.9;

        .enter {
            display: inline-block;
            position: relative;
            padding: 0.7rem 3rem;
            background: rgba(184, 163, 16, 0.05);
            border: 1px solid rgba(184, 163, 16, 0.5);
            color: #d4c24a;

            font-size: 0.8rem;
            letter-spacing: 6px;
            text-transform: uppercase;
            border-radius: 40px;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            transition: all 0.5s ease;
            overflow: hidden;
            box-shadow:
                0 0 25px rgba(184, 163, 16, 0.15),
                inset 0 0 15px rgba(184, 163, 16, 0.08);

        .enter::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 245, 194, 0.32), transparent);
            transition: left 0.7s ease;
        }

        .enter:hover::before {
            left: 100%;
        }

        .enter:hover {
            background: rgba(184, 163, 16, 0.18);
            border-color: rgba(184, 163, 16, 0.9);
            color: #fff5c2;
            box-shadow:
                0 0 40px rgba(184, 163, 16, 0.45),
                inset 0 0 25px rgba(184, 163, 16, 0.2);
            letter-spacing: 9px;
        }

        .bottom {
            position: fixed;
            bottom: 1.5rem;

            right: 0;

            font-size: 0.7rem;
            color: #444;

        .lang {
            position: fixed;
            top: 2rem;
            right: 2rem;
            display: flex;
            gap: 0.5rem;
            z-index: 5;

        .lang a {
            color: #555;
            text-decoration: none;
            font-size: 0.75rem;
            padding: 0.35rem 0.7rem;
            border: 1px solid #2a2a2a;
            border-radius: 4px;
            transition: all 0.3s;

        .lang a:hover { color: #b8a310; border-color: #b8a310; }
        .lang a.active { color: #d4c24a; border-color: #b8a310; background: rgba(184, 163, 16, 0.08); }

            .sub { font-size: 0.65rem; letter-spacing: 4px; margin-bottom: 3rem; }

            .star-burst { width: 600px; height: 600px; margin: -300px 0 0 -300px; }
            .star-burst span { height: 170px; transform: translateY(-50%) rotate(0deg) translateY(-170px); }
            .coin-outline { width: 260px; height: 260px; margin: -130px 0 0 -130px; }
            .coin-outline::before { width: 60px; height: 60px; margin: -30px 0 0 -30px; }
            .ring-1 { width: 380px; height: 380px; }
            .ring-2 { width: 480px; height: 480px; }
            .ring-3 { width: 300px; height: 300px; }
