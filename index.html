            content: '';
            position: fixed;
            inset: -20%;
            z-index: 0;
            pointer-events: none;
            background:
                radial-gradient(circle 300px at 30% 40%, rgba(120, 60, 220, 0.15), transparent 70%),
                radial-gradient(circle 250px at 70% 60%, rgba(220, 60, 180, 0.12), transparent 70%),
                radial-gradient(circle 200px at 50% 80%, rgba(60, 200, 240, 0.1), transparent 70%);
            filter: blur(40px);
            animation: dreamRotate 40s linear infinite;
        }

        @keyframes dreamShift {
            0%, 100% { filter: hue-rotate(0deg); }
            50% { filter: hue-rotate(30deg); }
        }

        @keyframes dreamRotate {
            0% { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(180deg) scale(1.15); }
            100% { transform: rotate(360deg) scale(1); }
        }

            letter-spacing: 5px;
            text-transform: uppercase;
            border-radius: 30px;
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            transition: all 0.5s ease;
            animation: float 5s ease-in-out infinite;
            box-shadow:
                0 0 20px rgba(184, 163, 16, 0.15),
                inset 0 0 12px rgba(184, 163, 16, 0.08);

        .enter:hover {

        @keyframes float {
            0%, 100% { transform: translateY(0); }
