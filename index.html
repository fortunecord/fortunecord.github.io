<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FortuneCord | 炼金术士的线稿世界</title>
    <style>
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, '思源黑体', sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
            background-color: #faf9f8;
            color: #1a1a1a;
            line-height: 1.6;
        }
        header {
            text-align: center;
            padding: 2rem 0;
            border-bottom: 2px solid #e0e0e0;
            margin-bottom: 2rem;
        }
        h1 {
            font-size: 2.5rem;
            margin: 0;
            color: #2c3e50;
        }
        .subtitle {
            font-size: 1.2rem;
            color: #7f8c8d;
            margin-top: 0.5rem;
        }
        .video-container {
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            margin: 2rem 0;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        video {
            width: 100%;
            display: block;
        }
        .nav {
            display: flex;
            gap: 1.5rem;
            justify-content: center;
            margin: 2rem 0;
            flex-wrap: wrap;
        }
        .nav a {
            text-decoration: none;
            color: #2c3e50;
            font-weight: 500;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            transition: all 0.2s;
        }
        .nav a:hover {
            background-color: #e0e0e0;
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1rem;
            margin: 2rem 0;
        }
        .gallery img {
            width: 100%;
            border-radius: 8px;
            transition: transform 0.2s;
        }
        .gallery img:hover {
            transform: scale(1.02);
        }
        footer {
            text-align: center;
            margin-top: 3rem;
            padding-top: 2rem;
            border-top: 1px solid #e0e0e0;
            font-size: 0.9rem;
            color: #7f8c8d;
        }
        @media (max-width: 768px) {
            body {
                padding: 1rem;
            }
            h1 {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>⚛️ FortuneCord</h1>
        <div class="subtitle">将你的守护之星，织入命运之绳</div>
        <div>Dan · 炼金术士的一根心绳</div>
    </header>

    <div class="nav">
        <a href="/">首页</a>
        <a href="portfolio.html">作品集</a>
        <a href="about.html">关于</a>
        <a href="https://fortunecord.wordpress.com">博客</a>
        <a href="https://github.com/fortunecord/fortunecord.github.io">存证页</a>
    </div>

    <div class="video-container">
        <video controls poster="assets/images/poster.jpg">
            <source src="assets/videos/一根钱绳的事.mp4" type="video/mp4">
            您的浏览器不支持视频播放。
        </video>
    </div>

    <div class="gallery">
        <!-- 这里放几张代表性作品图片 -->
        <img src="assets/images/作品1.jpg" alt="作品1">
        <img src="assets/images/作品2.jpg" alt="作品2">
        <img src="assets/images/作品3.jpg" alt="作品3">
    </div>

    <footer>
        <p>© 2026 FortuneCord | All rights reserved.</p>
        <p>授权联系：Fortunecord [at] qq [dot] com
(Please replace [at] with @ and [dot] with .)</p>
    </footer>
</body>
</html>
