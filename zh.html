        @keyframes nebula-shift {

        .halo {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 600px;
            height: 600px;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            border: 1px solid rgba(184, 163, 16, 0.15);
            box-shadow:
                0 0 60px rgba(120, 80, 220, 0.25),
                inset 0 0 60px rgba(120, 80, 220, 0.1);
            animation: halo-breathe 8s ease-in-out infinite;
            z-index: 1;
            pointer-events: none;
        }

        .halo::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 420px;
            height: 420px;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            border: 1px solid rgba(74, 246, 244, 0.12);
            box-shadow: 0 0 40px rgba(74, 246, 244, 0.15);
        }

        .halo::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 260px;
            height: 260px;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            border: 1px dashed rgba(255, 64, 192, 0.15);
            animation: halo-rotate 40s linear infinite;
        }

        @keyframes halo-breathe {
            0%, 100% { opacity: 0.7; transform: translate(-50%, -50%) scale(1); }
            50% { opacity: 1; transform: translate(-50%, -50%) scale(1.05); }
        }

        @keyframes halo-rotate {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }

            50% { text-shadow: 0 0 30px rgba(197, 185, 138, 0.6), 0 0 80px rgba(255, 64, 192, 0.4); }

        .enter {
            display: inline-block;
            position: relative;
            padding: 0.7rem 3rem;
            background: rgba(184, 163, 16, 0.05);
            border: 1px solid rgba(184, 163, 16, 0.5);
            color: #d4c24a;
            text-decoration: none;
            font-size: 0.8rem;
            letter-spacing: 8px;
            text-transform: uppercase;
            border-radius: 40px;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            transition: all 0.5s ease;
            overflow: hidden;
            box-shadow:
                0 0 25px rgba(184, 163, 16, 0.15),
                inset 0 0 15px rgba(184, 163, 16, 0.08);
        }

        .enter::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 245, 194, 0.25), transparent);
            transition: left 0.7s ease;
        }

        .enter:hover::before {
            left: 100%;

        .enter:hover {
            background: rgba(184, 163, 16, 0.15);
            border-color: rgba(184, 163, 16, 0.9);
            color: #fff5c2;
