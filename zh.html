        body::after {

            position: fixed;
            inset: 0;

            background-image:
                radial-gradient(2.5px 2.5px at 13% 24%, #fff, transparent),

        @keyframes nebula-shift {
            0%, 100% { opacity: 0.9; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.05); }
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.9; }
            50% { opacity: 0.6; }
        }

        .cord-band {
            position: fixed;
            top: 55%;
            left: -10%;
            width: 120%;
            height: 80px;
            transform: translateY(-50%) rotate(-14deg);
            background-image: repeating-linear-gradient(
                100deg,
                transparent 0,
                transparent 6px,
                rgba(197, 185, 138, 0.4) 6px,
                rgba(197, 185, 138, 0.4) 7px,
                transparent 7px,
                transparent 12px,
                rgba(74, 246, 244, 0.25) 12px,
                rgba(74, 246, 244, 0.25) 13px,
                transparent 13px,
                transparent 18px
            );
            -webkit-mask-image: linear-gradient(90deg, transparent 0%, black 25%, black 75%, transparent 100%);
            mask-image: linear-gradient(90deg, transparent 0%, black 25%, black 75%, transparent 100%);
            box-shadow:
                0 0 30px rgba(197, 185, 138, 0.3),
                0 0 60px rgba(120, 80, 220, 0.2);
            animation: cord-drift 25s linear infinite;
            pointer-events: none;
            z-index: 1;
            opacity: 0.65;
        }

        @keyframes cord-drift {
            0% { background-position: 0 0, 0 0; }
            100% { background-position: 400px 0, 400px 0; }
        }

        .star-arc {
            position: fixed;
            top: 50%;
            left: 50%;
            border-radius: 50%;
            pointer-events: none;
            z-index: 1;
            border: 1px solid transparent;
        }

        .arc-1 {
            width: 850px;
            height: 850px;
            margin: -425px 0 0 -425px;
            border-top-color: rgba(120, 80, 220, 0.4);
            border-right-color: rgba(120, 80, 220, 0.08);
            animation: arc-rotate-1 120s linear infinite;
        }

        .arc-2 {
            width: 1150px;
            height: 1150px;
            margin: -575px 0 0 -575px;
            border-left-color: rgba(74, 246, 244, 0.3);
            border-bottom-color: rgba(74, 246, 244, 0.08);
            animation: arc-rotate-2 160s linear infinite reverse;
        }

        .arc-3 {
            width: 620px;
            height: 620px;
            margin: -310px 0 0 -310px;
            border-bottom-color: rgba(255, 64, 192, 0.28);
            border-top-color: rgba(255, 64, 192, 0.08);
            animation: arc-rotate-3 90s linear infinite;
        }

        @keyframes arc-rotate-1 {
            0% { transform: rotate(35deg); }
            100% { transform: rotate(395deg); }
        }

        @keyframes arc-rotate-2 {
            0% { transform: rotate(120deg); }
            100% { transform: rotate(480deg); }
        }

        @keyframes arc-rotate-3 {
            0% { transform: rotate(-60deg); }
            100% { transform: rotate(300deg); }
        }

        .horizon {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 280px;
            background: radial-gradient(
                ellipse at center bottom,
                rgba(120, 80, 220, 0.32) 0%,
                rgba(60, 40, 120, 0.15) 35%,
                transparent 72%
            );
            pointer-events: none;
            z-index: 1;
        }

        .vignette {
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse at center, transparent 35%, rgba(0, 0, 0, 0.45) 100%),
                linear-gradient(180deg, rgba(0, 0, 0, 0.35) 0%, transparent 22%, transparent 78%, rgba(0, 0, 0, 0.3) 100%);
            pointer-events: none;
            z-index: 2;
        }

        .floaters {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 1;
        }

        .floater {
            position: absolute;
            border-radius: 50%;
            filter: blur(0.6px);
        }

        .f1 {
            top: 18%;
            left: 15%;
            width: 5px;
            height: 5px;
            background: rgba(255, 235, 170, 1);
            box-shadow: 0 0 10px rgba(255, 235, 170, 0.9), 0 0 22px rgba(255, 235, 170, 0.5);
            animation: float-a 14s ease-in-out infinite;
        }

        .f2 {
            top: 32%;
            left: 82%;
            width: 4px;
            height: 4px;
            background: rgba(74, 246, 244, 1);
            box-shadow: 0 0 10px rgba(74, 246, 244, 0.9), 0 0 22px rgba(74, 246, 244, 0.5);
            animation: float-b 18s ease-in-out infinite;

        .f3 {

            left: 22%;

            height: 6px;

            animation: float-d 17s ease-in-out infinite reverse;

        @keyframes float-a {
            0%, 100% { transform: translate(0, 0); opacity: 0.7; }
            50% { transform: translate(15px, -25px); opacity: 1; }
        }

        @keyframes float-b {
            0%, 100% { transform: translate(0, 0); opacity: 0.6; }
            50% { transform: translate(-20px, 22px); opacity: 1; }

        @keyframes float-d {
            0%, 100% { transform: translate(0, 0); opacity: 0.6; }
            50% { transform: translate(18px, 20px); opacity: 1; }

            letter-spacing: 8px;
            text-transform: uppercase;
            border-radius: 40px;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            transition: all 0.5s ease;
            overflow: hidden;
            box-shadow:
                0 0 25px rgba(184, 163, 16, 0.15),
                inset 0 0 15px rgba(184, 163, 16, 0.08);
        }

        .enter::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 245, 194, 0.3), transparent);
            transition: left 0.7s ease;

            left: 100%;

            background: rgba(184, 163, 16, 0.18);
            border-color: rgba(184, 163, 16, 0.9);

        .lang a.active { color: #d4c24a; border-color: #b8a310; background: rgba(184, 163, 16, 0.08); }

            h1 { font-size: 2.2rem; letter-spacing: 4px; }
